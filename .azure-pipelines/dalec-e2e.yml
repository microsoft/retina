# E2E-only entry point for coordinated Dalec agent/init/operator images.
# The ADO definition supplies AZURE_LOCATION and AZURE_AGENT_*_SKU variables.
trigger: none
pr: none

parameters:
  - name: imageRegistry
    displayName: Prebuilt image registry (hostname only)
    type: string
    default: acnpublic.azurecr.io
  - name: imageNamespace
    displayName: Prebuilt image namespace
    type: string
    default: ''
  - name: imageTag
    displayName: Prebuilt image tag (shared by agent, init, and operator)
    type: string
    default: ''
  - name: eventWriterImage
    displayName: Windows E2E event-writer image (full reference or digest)
    type: string
    default: ''

variables:
  - name: LinuxContainerImage
    value: mcr.microsoft.com/onebranch/azurelinux/build:3.0
  - name: azureServiceConnection
    value: Azure Container Networking - Build Validations - Federated

resources:
  repositories:
    - repository: templates
      type: git
      name: OneBranch.Pipelines/GovernedTemplates
      ref: refs/heads/main

extends:
  template: v2/OneBranch.NonOfficial.CrossPlat.yml@templates
  parameters:
    featureFlags:
      golang:
        internalModuleProxy:
          enabled: true
    globalSdl:
      policheck:
        break: false
      binskim:
        break: false
    stages:
      - stage: test
        displayName: Run prebuilt Dalec E2E
        jobs:
          - job: e2e
            displayName: E2E Tests
            timeoutInMinutes: 90
            pool:
              type: linux
            variables:
              ob_outputDirectory: $(Build.SourcesDirectory)/out
              CLUSTER_NAME: retina-e2e-$(Build.BuildId)-$(System.JobAttempt)
              e2eImageRegistry: ${{ parameters.imageRegistry }}
              e2eImageNamespace: ${{ parameters.imageNamespace }}
              e2eImageTag: ${{ parameters.imageTag }}
            steps:
              - bash: |
                  set -euo pipefail
                  : "${IMAGE_REGISTRY:?imageRegistry is required}"
                  : "${IMAGE_NAMESPACE:?imageNamespace is required}"
                  : "${E2E_IMAGE_TAG:?imageTag is required}"
                  : "${EVENT_WRITER_IMAGE:?eventWriterImage is required}"
                  for input in "$IMAGE_REGISTRY" "$IMAGE_NAMESPACE" "$E2E_IMAGE_TAG" "$EVENT_WRITER_IMAGE"; do
                    if [[ "$input" =~ [[:space:]] ]]; then
                      echo "##vso[task.logissue type=error]Prebuilt image inputs must not contain whitespace"
                      exit 1
                    fi
                  done
                displayName: Validate prebuilt image inputs
                env:
                  IMAGE_REGISTRY: $(e2eImageRegistry)
                  IMAGE_NAMESPACE: $(e2eImageNamespace)
                  E2E_IMAGE_TAG: $(e2eImageTag)
                  EVENT_WRITER_IMAGE: ${{ parameters.eventWriterImage }}
              - bash: tdnf install -y kubernetes-client && kubectl version --client
                displayName: Install kubectl
              - task: AzureCLI@2
                displayName: Run E2E Tests
                env:
                  AZURE_LOCATION: $(AZURE_LOCATION)
                  AZURE_AGENT_LINUX_SKU: $(AZURE_AGENT_LINUX_SKU)
                  AZURE_AGENT_WINDOWS_SKU: $(AZURE_AGENT_WINDOWS_SKU)
                  AZURE_AGENT_LINUX_ARM_SKU: $(AZURE_AGENT_LINUX_ARM_SKU)
                  IMAGE_REGISTRY: $(e2eImageRegistry)
                  IMAGE_NAMESPACE: $(e2eImageNamespace)
                  E2E_IMAGE_TAG: $(e2eImageTag)
                  EVENT_WRITER_IMAGE: ${{ parameters.eventWriterImage }}
                inputs:
                  azureSubscription: $(azureServiceConnection)
                  scriptType: bash
                  scriptLocation: inlineScript
                  inlineScript: |
                    set -euo pipefail
                    export TAG="${E2E_IMAGE_TAG:?E2E image tag is required}"
                    export AZURE_SUBSCRIPTION_ID=$(az account show --query id -o tsv)
                    go test -v ./test/e2e/. -timeout 60m -tags=e2e -count=1 -args \
                      -image-tag="$TAG" \
                      -image-registry="$IMAGE_REGISTRY" \
                      -image-namespace="$IMAGE_NAMESPACE"
              - task: AzureCLI@2
                displayName: Cleanup resource group
                condition: always()
                inputs:
                  azureSubscription: $(azureServiceConnection)
                  scriptType: bash
                  scriptLocation: inlineScript
                  inlineScript: |
                    set -euo pipefail
                    if [[ "$(az group exists --name "$(CLUSTER_NAME)")" == true ]]; then
                      az group delete --name "$(CLUSTER_NAME)" --yes --no-wait
                    fi
