# Install the Go version that the repo's go.mod selects: the toolchain line
# if it exists, otherwise the go line. ADO's GoTool@0 does not read go.mod
# (unlike GitHub Actions' setup-go, which applies the same rule), so we parse
# it explicitly and pass the value.
#
# Assumes `checkout: self` has already run in the calling job.
steps:
  - bash: |
      set -euo pipefail
      GO_VER=$(awk '/^toolchain go[0-9]/ {sub(/^go/, "", $2); print $2; exit}' go.mod)
      if [ -z "$GO_VER" ]; then
        GO_VER=$(awk '/^go [0-9]/ {print $2; exit}' go.mod)
      fi
      echo "Detected Go version from go.mod: $GO_VER"
      echo "##vso[task.setvariable variable=GO_VERSION_FROM_GO_MOD]$GO_VER"
    displayName: Read Go version from go.mod
  - task: GoTool@0
    inputs:
      version: $(GO_VERSION_FROM_GO_MOD)
