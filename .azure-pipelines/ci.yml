      - task: AzureCLI@2
        displayName: Cleanup resource group
        condition: always()
        inputs:
          azureSubscription: $(azureServiceConnection)
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
            if az group exists --name "$(CLUSTER_NAME)" 2>/dev/null | grep -q true; then
