# retina CI pipeline (Azure DevOps).
#
# Mirrors .github/workflows/images.yaml. Triggered by:
#   - GitHub merge-queue events (push to gh-readonly-queue/main/*) via the
#     Azure Pipelines GitHub App -> full run: builds, pushes to ACR, embeds
#     APP_INSIGHTS_ID, builds the E2E event writer, and runs manifests + e2e +
#     perf tests.
#   - Pull requests targeting main -> build only (no push, no telemetry key
#     embedded, manifests/e2e/perf skipped) - same as GH pull_request behavior.
#   - Manual queue from ADO UI -> build only by default. Set runE2EValidation
#     to publish branch images, generate manifests, and run e2e.
#
# Required ADO pipeline configuration (set in the ADO UI before first run):
#   Variables (plain):
#     ACR_NAME                    e.g. retinaacr (or full FQDN, matches current vars.ACR_NAME)
#     AZURE_LOCATION              e.g. eastus2
#     AZURE_AGENT_LINUX_SKU
#     AZURE_AGENT_WINDOWS_SKU
#     AZURE_AGENT_LINUX_ARM_SKU
#   Variables (secret):
#     AZURE_APP_INSIGHTS_KEY
#   Service connection for publishing runs (Azure RM, WIF):
#     Azure Container Networking - Build Validations - Federated
#   Settings: "Limit building pull requests from forked GitHub repositories" = Disable

trigger:
  branches:
    include:
      - gh-readonly-queue/main/*

pr:
  branches:
    include:
      - main

parameters:
  - name: runE2EValidation
    displayName: Publish branch images and run E2E
    type: boolean
    default: false

variables:
  - name: azureServiceConnection
    value: Azure Container Networking - Build Validations - Federated
  - name: imageNamespace
    value: microsoft/retina
  - name: isMergeQueue
    value: $[ startsWith(variables['Build.SourceBranch'], 'refs/heads/gh-readonly-queue/') ]
  # Merge-queue runs and opted-in manual runs publish branch images and run E2E.
  # PR builds and manual queues with the checkbox off remain dry-run builds.
  - name: publishImagesAndRunE2E
    ${{ if eq(parameters.runE2EValidation, true) }}:
      value: 'True'
    ${{ else }}:
      value: $[ startsWith(variables['Build.SourceBranch'], 'refs/heads/gh-readonly-queue/') ]

jobs:
  - job: retina_images
    displayName: Build Agent Images - Linux
    timeoutInMinutes: 60
    strategy:
      matrix:
        amd64:
          arch: amd64
        arm64:
          arch: arm64
    pool:
      vmImage: ubuntu-latest
    steps:
      - checkout: self
        fetchDepth: 0
      - template: steps/free-disk-space.yml
      - bash: make qemu-user-static
        displayName: Set up QEMU
      - template: steps/setup-go.yml
      - ${{ if or(eq(parameters.runE2EValidation, true), startsWith(variables['Build.SourceBranch'], 'refs/heads/gh-readonly-queue/')) }}:
        - task: AzureCLI@2
          displayName: Build and push retina image
          env:
            APP_INSIGHTS_ID: $(AZURE_APP_INSIGHTS_KEY)
          inputs:
            azureSubscription: $(azureServiceConnection)
            scriptType: bash
            scriptLocation: inlineScript
            inlineScript: |
              set -euo pipefail
              TAG=$(make version)
              az acr login -n $(ACR_NAME)
              make retina-image \
                IMAGE_NAMESPACE=$(imageNamespace) \
                PLATFORM=linux/$(arch) \
                IMAGE_REGISTRY=$(ACR_NAME) \
                APP_INSIGHTS_ID=$APP_INSIGHTS_ID \
                TAG=$TAG \
                BUILDX_ACTION=--push
      - ${{ else }}:
        - bash: |
            set -euo pipefail
            TAG=$(make version)
            make retina-image \
              IMAGE_NAMESPACE=$(imageNamespace) \
              PLATFORM=linux/$(arch) \
              TAG=$TAG
          displayName: Build retina image

  - job: build_windows_binaries
    displayName: Build Windows Binaries
    timeoutInMinutes: 30
    pool:
      vmImage: ubuntu-latest
    steps:
      - checkout: self
        fetchDepth: 0
      - template: steps/setup-go.yml
      - bash: |
          set -euo pipefail
          TAG=$(make version)
          make build-windows-binaries \
            GOOS=windows \
            GOARCH=amd64 \
            TAG=$TAG \
            APP_INSIGHTS_ID=$APP_INSIGHTS_ID
        displayName: make build-windows-binaries
        env:
          APP_INSIGHTS_ID: $(AZURE_APP_INSIGHTS_KEY)
      - task: PublishPipelineArtifact@1
        inputs:
          targetPath: output/windows_amd64/
          artifactName: windows-binaries

  - job: retina_image_win
    displayName: Build Agent Image - Windows 2022
    dependsOn: build_windows_binaries
    timeoutInMinutes: 60
    pool:
      vmImage: windows-2022
    variables:
      year: '2022'
      arch: amd64
      platform: windows
    steps:
      - checkout: self
        fetchDepth: 0
      - task: DownloadPipelineArtifact@2
        inputs:
          artifactName: windows-binaries
          targetPath: output/windows_amd64/
      - powershell: |
          $timeout = 120
          $timer = [Diagnostics.Stopwatch]::StartNew()
          while ($timer.Elapsed.TotalSeconds -lt $timeout) {
            $svc = Get-Service docker -ErrorAction SilentlyContinue
            if ($svc -and $svc.Status -ne 'Running') {
              Start-Service docker -ErrorAction SilentlyContinue
            }
            $result = docker info 2>&1
            if ($LASTEXITCODE -eq 0) {
              Write-Host "Docker daemon is ready"
              return
            }
            Write-Host "Waiting for Docker daemon to start..."
            Start-Sleep -Seconds 5
          }
          throw "Docker daemon failed to start within $timeout seconds"
        displayName: Ensure Docker daemon is running
      - ${{ if or(eq(parameters.runE2EValidation, true), startsWith(variables['Build.SourceBranch'], 'refs/heads/gh-readonly-queue/')) }}:
        - task: AzureCLI@2
          displayName: Build and push retina Windows image
          env:
            APP_INSIGHTS_ID: $(AZURE_APP_INSIGHTS_KEY)
          inputs:
            azureSubscription: $(azureServiceConnection)
            scriptType: bash
            scriptLocation: inlineScript
            inlineScript: |
              set -euo pipefail
              TAG=$(make version)
              az acr login -n $(ACR_NAME)
              make retina-image-win \
                IMAGE_NAMESPACE=$(imageNamespace) \
                PLATFORM=$(platform)/$(arch) \
                WINDOWS_YEARS=$(year) \
                IMAGE_REGISTRY=$(ACR_NAME) \
                APP_INSIGHTS_ID=$APP_INSIGHTS_ID \
                BINARIES_PATH=output/windows_$(arch) \
                REPO_PATH=. \
                TAG=$TAG
              docker push $(ACR_NAME)/$(imageNamespace)/retina-agent:${TAG}-windows-ltsc$(year)-$(arch)
      - ${{ else }}:
        - bash: |
            set -euo pipefail
            TAG=$(make version)
            make retina-image-win \
              IMAGE_NAMESPACE=$(imageNamespace) \
              PLATFORM=$(platform)/$(arch) \
              WINDOWS_YEARS=$(year) \
              BINARIES_PATH=output/windows_$(arch) \
              REPO_PATH=. \
              TAG=$TAG
          displayName: Build retina Windows image

  - job: event_writer_image
    displayName: Build E2E Test Event Writer Image
    condition: and(succeeded(), eq(variables['publishImagesAndRunE2E'], 'True'))
    timeoutInMinutes: 60
    pool:
      vmImage: windows-2022
    variables:
      eventWriterPath: $(Build.SourcesDirectory)\test\e2e\tools\event-writer
      ebpfVersion: '1.1.0'
    steps:
      - checkout: self
        fetchDepth: 0
      - powershell: |
          $timeout = 120
          $timer = [Diagnostics.Stopwatch]::StartNew()
          while ($timer.Elapsed.TotalSeconds -lt $timeout) {
            $svc = Get-Service docker -ErrorAction SilentlyContinue
            if ($svc -and $svc.Status -ne 'Running') {
                Start-Service docker -ErrorAction SilentlyContinue
            }
            $result = docker info 2>&1
            if ($LASTEXITCODE -eq 0) {
                Write-Host "Docker daemon is ready"
                return
            }
            Write-Host "Waiting for Docker daemon to start..."
            Start-Sleep -Seconds 5
          }
          throw "Docker daemon failed to start within $timeout seconds"
        displayName: Ensure Docker daemon is running
      - powershell: |
          choco install llvm --version=18.1.8 --allow-downgrade -y --force
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to install LLVM 18.1.8"
          }
          Write-Host "##vso[task.prependpath]C:\Program Files\LLVM\bin"
          Write-Host "##vso[task.prependpath]C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\bin"
        displayName: Install LLVM and configure build tools
      - powershell: nuget restore .\event_writer.sln
        displayName: NuGet restore
        workingDirectory: $(eventWriterPath)
      - powershell: |
          .\export_program_info.exe --clear
          .\export_program_info.exe
        displayName: Configure eBPF store
        workingDirectory: $(eventWriterPath)\packages\eBPF-for-Windows.x64.$(ebpfVersion)\build\native\bin
      - powershell: |
          msbuild /m /t:Clean /p:Configuration=Release /p:Platform=x64 /restore event_writer.sln
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to clean event-writer solution"
          }
          msbuild /m /p:Configuration=Release /p:Platform=x64 /restore /v:detailed event_writer.sln
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to build event-writer solution"
          }
        displayName: Build event writer
        workingDirectory: $(eventWriterPath)
      - task: AzureCLI@2
        displayName: Build and push event-writer image
        inputs:
          azureSubscription: $(azureServiceConnection)
          scriptType: ps
          scriptLocation: inlineScript
          workingDirectory: $(eventWriterPath)
          inlineScript: |
            $tag = git tag --points-at HEAD
            if (-not $tag) {
              $tag = git rev-parse --short HEAD
            }
            $image = "$(ACR_NAME)/$(imageNamespace)/test/e2e-test-event-writer".ToLower()

            az acr login --name "$(ACR_NAME)"
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to log in to ACR"
            }

            docker build -f .\Dockerfile -t "${image}:${tag}" -t "${image}:latest" .
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to build event-writer image"
            }
            docker push "${image}:${tag}"
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to push event-writer image tag ${tag}"
            }
            docker push "${image}:latest"
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to push latest event-writer image"
            }

  - job: operator_images
    displayName: Build Operator Images
    timeoutInMinutes: 60
    strategy:
      matrix:
        amd64:
          arch: amd64
        arm64:
          arch: arm64
    pool:
