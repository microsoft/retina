            set -euo pipefail
            TAG=$(make version)
            make kubectl-retina-image \
              IMAGE_NAMESPACE=$(imageNamespace) \
              PLATFORM=linux/$(arch) \
              TAG=$TAG
          displayName: Build kubectl-retina image

  - job: manifests
    displayName: Generate Manifests
    condition: and(succeeded(), eq(variables['publishImagesAndRunE2E'], 'True'))
    dependsOn:
      - retina_images
      - retina_image_win
      - operator_images
      - retina_shell_images
      - kubectl_retina_images
    timeoutInMinutes: 30
    pool:
      vmImage: ubuntu-latest
    strategy:
      matrix:
        retina:
          component: retina
        operator:
          component: operator
        shell:
          component: shell
        kubectl-retina:
          component: kubectl-retina
    steps:
      - checkout: self
        fetchDepth: 0
      - bash: make qemu-user-static
        displayName: Set up QEMU
      - task: AzureCLI@2
        displayName: make manifest
        inputs:
          azureSubscription: $(azureServiceConnection)
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
            set -euo pipefail
            TAG=$(make version)
            az acr login -n $(ACR_NAME)
            make manifest COMPONENT=$(component) IMAGE_REGISTRY=$(ACR_NAME) TAG=$TAG

  - job: e2e
    displayName: Run E2E Tests
    condition: and(succeeded(), eq(variables['publishImagesAndRunE2E'], 'True'))
    dependsOn:
      - manifests
      - event_writer_image
    timeoutInMinutes: 90
    pool:
      vmImage: ubuntu-latest
    variables:
      CLUSTER_NAME: retina-e2e-$(Build.BuildId)-$(System.JobAttempt)
    steps:
      - checkout: self
        fetchDepth: 0
      - template: steps/setup-go.yml
      - task: AzureCLI@2
        displayName: Run E2E Tests
        env:
          AZURE_LOCATION: $(AZURE_LOCATION)
          AZURE_AGENT_LINUX_SKU: $(AZURE_AGENT_LINUX_SKU)
          AZURE_AGENT_WINDOWS_SKU: $(AZURE_AGENT_WINDOWS_SKU)
          AZURE_AGENT_LINUX_ARM_SKU: $(AZURE_AGENT_LINUX_ARM_SKU)
        inputs:
          azureSubscription: $(azureServiceConnection)
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
            set -euo pipefail
            export AZURE_SUBSCRIPTION_ID=$(az account show --query id -o tsv)
            go test -v ./test/e2e/. -timeout 60m -tags=e2e -count=1 -args \
              -image-tag=$(make version) \
              -image-registry=$(ACR_NAME) \
              -image-namespace=$(imageNamespace)
      - task: AzureCLI@2
        displayName: Cleanup resource group
        condition: always()
        inputs:
          azureSubscription: $(azureServiceConnection)
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
            if az group exists --name "$(CLUSTER_NAME)" 2>/dev/null | grep -q true; then
              echo "Deleting resource group $(CLUSTER_NAME)..."
              az group delete --name "$(CLUSTER_NAME)" --yes --no-wait || true
            fi

  - job: perf_basic
    displayName: Retina basic Performance Test
    condition: and(succeeded(), eq(variables['isMergeQueue'], 'True'))
    dependsOn:
      - manifests
      - e2e
    timeoutInMinutes: 150
    pool:
      vmImage: ubuntu-latest
    variables:
      CLUSTER_NAME: retina-perf-basic-$(Build.BuildId)-$(System.JobAttempt)
      MODE: basic
    steps:
      - checkout: self
        fetchDepth: 0
      - template: steps/setup-go.yml
      - task: AzureCLI@2
        displayName: Run perf test
        env:
          AZURE_APP_INSIGHTS_KEY: $(AZURE_APP_INSIGHTS_KEY)
          AZURE_LOCATION: $(AZURE_LOCATION)
          AZURE_AGENT_LINUX_SKU: $(AZURE_AGENT_LINUX_SKU)
          AZURE_AGENT_WINDOWS_SKU: $(AZURE_AGENT_WINDOWS_SKU)
          AZURE_AGENT_LINUX_ARM_SKU: $(AZURE_AGENT_LINUX_ARM_SKU)
        inputs:
          azureSubscription: $(azureServiceConnection)
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
            set -euo pipefail
            export AZURE_SUBSCRIPTION_ID=$(az account show --query id -o tsv)
            TAG=$(make version)
            echo "Running in $MODE mode..."
            go test -v ./test/e2e/. -timeout 2h -tags=perf -count=1 -args \
              -image-tag="$TAG" \
              -image-registry="$(ACR_NAME)" \
              -image-namespace="$(imageNamespace)" \
              -retina-mode="$MODE"
      - task: AzureCLI@2
        displayName: Cleanup resource group
        condition: always()
        inputs:
          azureSubscription: $(azureServiceConnection)
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
            if az group exists --name "$(CLUSTER_NAME)" 2>/dev/null | grep -q true; then
              echo "Deleting resource group $(CLUSTER_NAME)..."
              az group delete --name "$(CLUSTER_NAME)" --yes --no-wait || true
            fi

  - job: perf_advanced
    displayName: Retina advanced Performance Test
    condition: and(succeeded(), eq(variables['isMergeQueue'], 'True'))
    dependsOn:
      - manifests
      - e2e
    timeoutInMinutes: 150
    pool:
      vmImage: ubuntu-latest
    variables:
