name: Test Retina Image
on:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-windows-build:
    name: Build Windows Test Binaries
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build shared Windows binaries
        run: make build-windows-binaries GOARCH=amd64 TAG=${{ github.sha }} APP_INSIGHTS_ID=

      - name: Upload Windows test binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-test-binaries
          path: output/windows_amd64/
          if-no-files-found: error
          retention-days: 1

  test-windows-images:
    name: Test Windows Image (${{ matrix.year }})
    needs: test-windows-build
    runs-on: windows-${{ matrix.year }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      matrix:
        year: ["2022", "2025"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Windows test binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-test-binaries
          path: output/windows_amd64/

      - name: Install GNU Make
        run: choco install make --no-progress --yes

      - name: Ensure Docker daemon is running
        shell: pwsh
        run: |
          $timeout = 120
          $timer = [Diagnostics.Stopwatch]::StartNew()
          while ($timer.Elapsed.TotalSeconds -lt $timeout) {
            $svc = Get-Service docker -ErrorAction SilentlyContinue
            if ($svc -and $svc.Status -ne 'Running') {
              Start-Service docker -ErrorAction SilentlyContinue
            }
            $result = docker info 2>&1
            if ($LASTEXITCODE -eq 0) {
              Write-Host "Docker daemon is ready"
              return
            }
            Write-Host "Waiting for Docker daemon to start..."
            Start-Sleep -Seconds 5
          }
          throw "Docker daemon failed to start within $timeout seconds"

      - name: Build Windows image without publishing
        shell: bash
        run: |
          make retina-image-win \
            IMAGE_NAMESPACE=${{ github.repository }} \
            WINDOWS_YEARS=${{ matrix.year }} \
            BINARIES_PATH=output/windows_amd64 \
            REPO_PATH=. \
            TAG=${{ github.sha }}

      - name: Verify registry hardening in the built image
        shell: bash
        run: |
          image="ghcr.io/${{ github.repository }}/retina-agent:${{ github.sha }}-windows-ltsc${{ matrix.year }}-amd64"
          docker run --rm "$image" powershell.exe -NoProfile -NonInteractive -Command '$ErrorActionPreference="Stop"; foreach ($key in @("HKLM:\Software\Microsoft\Cryptography\Wintrust\Config", "HKLM:\Software\Wow6432Node\Microsoft\Cryptography\Wintrust\Config")) { if ((Get-ItemProperty -LiteralPath $key -Name EnableCertPaddingCheck).EnableCertPaddingCheck -ne 1) { throw "Registry hardening missing: $key" } }; Write-Output "Registry hardening verified"'

  test-windows:
    name: Test Windows Unit Tests (${{ matrix.year }})
    runs-on: windows-${{ matrix.year }}
    timeout-minutes: 20
    strategy:
      matrix:
        year: ["2022", "2025"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install GNU Make
        run: choco install make --no-progress --yes

      - name: Run Windows unit tests
        run: make test-windows

  test-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Make Retina Test image
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          make test-image IMAGE_NAMESPACE=${{ github.repository }} PLATFORM=linux/amd64

      - name: Upload Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-files
          path: ./artifacts/coverage*

      - name: Generate coverage summary
        run: |
          COVERAGE_FILE="./artifacts/coverage.out"
          if [ ! -s "$COVERAGE_FILE" ]; then
            echo "::warning::Coverage file is empty or missing"
            echo "## Test Coverage" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo ":warning: No coverage data available." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Filter out generated files (eBPF, mocks)
          grep -Ev '_bpf\.go|_bpfel_x86\.go|_bpfel_arm64\.go|_generated\.go|mock_' "$COVERAGE_FILE" > coverage_filtered.out

          # Generate function-level coverage report
          go tool cover -func=coverage_filtered.out > coverage_func.out

          # Extract total coverage percentage
          TOTAL_COVERAGE=$(grep '^total:' coverage_func.out | awk '{print $NF}')

          # Write step summary
          {
            echo "## Test Coverage"
            echo ""
            echo ":white_check_mark: **Tests passed**"
            echo ""
            echo "| Metric | Value |"
            echo "| --- | --- |"
            echo "| Total Coverage | \`${TOTAL_COVERAGE}\` |"
            echo ""
            echo "<details>"
            echo "<summary>Coverage by package (top 20 lowest)</summary>"
            echo ""
            echo '```'
            grep -v '^total:' coverage_func.out | sort -t'%' -k1 -n | head -20
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Compare coverage with main branch
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          COVERAGE_FILE="./artifacts/coverage.out"
          if [ ! -s "$COVERAGE_FILE" ]; then
            echo "Coverage file is empty or missing, skipping comparison"
            exit 0
          fi

          # Filter generated files and prepare current branch coverage
          grep -Ev '_bpf\.go|_bpfel_x86\.go|_bpfel_arm64\.go|_generated\.go|mock_' "$COVERAGE_FILE" > coveragenew.out
          cp coveragenew.out coverage.out
          go tool cover -func=coveragenew.out -o coverageexpanded.out

          # Install Python dependency for GitHub API calls
          pip install --quiet requests

          # Fetch main branch coverage
          python3 scripts/coverage/get_coverage.py

          # Check if main branch coverage was downloaded
          if [ ! -f mainbranchcoverage/coverage.out ]; then
            echo "No main branch coverage found, skipping comparison"
            exit 0
          fi

          # Filter main branch coverage
          grep -Ev '_bpf\.go|_bpfel_x86\.go|_bpfel_arm64\.go|_generated\.go|mock_' mainbranchcoverage/coverage.out > mainbranchcoverage/coverage_filtered.out
          mv mainbranchcoverage/coverage_filtered.out mainbranchcoverage/coverage.out

          # Generate expanded coverage for main branch
          go tool cover -func=mainbranchcoverage/coverage.out -o maincoverageexpanded.out

          # Post PR comment with coverage diff
          python3 scripts/coverage/compare_cov.py
